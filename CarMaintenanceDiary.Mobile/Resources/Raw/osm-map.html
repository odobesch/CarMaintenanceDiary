<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>OSM Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        let map;

        // This function will be called from .NET MAUI (C#) after location is available
        function initMap(lat, lng, zoom = 13) {
            console.log("🗺️ initMap called with:", lat, lng);

            map = L.map('map').setView([lat, lng], zoom);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // Show user marker
            L.marker([lat, lng], {
                icon: L.icon({
                    iconUrl: 'https://cdn-icons-png.flaticon.com/512/64/64113.png',
                    iconSize: [32, 32],
                    iconAnchor: [16, 32],
                    popupAnchor: [0, -32]
                })
            }).addTo(map).bindPopup("You are here").openPopup();
        }

        function addGasStations(stations) {
            console.log("⛽ addGasStations called with:", stations);

            if (!stations || stations.length === 0) {
                console.warn("No fuel stations to show.");
                return;
            }

            stations.forEach(function (station) {
                if (station.latitude && station.longitude) {
                    L.marker([station.latitude, station.longitude])
                        .addTo(map)
                        .bindPopup(station.name || "Unnamed Station");
                }
            });
        }
    </script>
</body>
</html>
